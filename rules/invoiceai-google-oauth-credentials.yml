rules:
  - id: invoiceai-google-oauth-credentials
    languages: [json]
    severity: ERROR
    message: |
      Google Auth cradentials as found! Please remove them from the code and use environment variables.
    metadata:
      category: security
      cwe: CWE-312
    pattern-either:
      - pattern: |
          {"installed": {"client_secret": "...", ...}}
      - pattern: |
          {"web": {"client_secret": "...", ...}}
      - pattern: |
          {"token": "...", "refresh_token": "...", ...}
    