apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apply everything with:  kubectl apply -k k8s/
# (Create the invoiceai-secrets Secret first — see README.md — it is intentionally
#  NOT listed here so real secret values never live in git.)
resources:
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: invoiceai
    includeSelectors: false
