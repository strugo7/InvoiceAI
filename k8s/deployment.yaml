apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoiceai-backend
  labels:
    app.kubernetes.io/name: invoiceai-backend
    app.kubernetes.io/part-of: invoiceai
spec:
  # IMPORTANT: keep this at 1. The app runs an in-process APScheduler that fires
  # the monthly report; with >1 replica every replica would fire it -> duplicate
  # emails. Scale out only after the scheduler is externalised (e.g. K8s CronJob).
  replicas: 1
  strategy:
    # Recreate (not RollingUpdate) so two scheduler instances never overlap
    # during a rollout.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: invoiceai-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: invoiceai-backend
    spec:
      # Pod-level hardening. Matches the non-root user baked into the image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: invoiceai-backend:latest
          # Use the locally-built image in k3s; never try to pull from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          # All runtime config (GEMINI_API_KEY, SUPABASE_*, OAuth, SHEET_ID, ...)
          # comes from a Secret created out-of-band from backend/.env. See README.
          envFrom:
            - secretRef:
                name: invoiceai-secrets
          # startupProbe gates liveness/readiness until the app has booted
          # (lifespan starts the scheduler, etc.). ~60s budget.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Container-level hardening.
          securityContext:
            allowPrivilegeEscalation: false
            # false because the app writes invoices.json / reports/ under /app.
            # Flip to true once those paths move to a mounted writable volume.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
