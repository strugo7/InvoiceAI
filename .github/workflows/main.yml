name: "Security CI Pipeline"

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  # 1. סריקת סודות (Gitleaks)
  gitleaks:
    name: "🔑 Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # חובה כדי לסרוק את כל ההיסטוריה ולא רק את הקוד הנוכחי

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. סריקת קוד სტטית (Opengrep - כבר יש לנו)
  opengrep:
    name: "🔍 SAST Scan (Opengrep)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/scripts/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Run Opengrep
        run: |
          opengrep scan \
            --config p/python \
            --config p/secrets \
            --sarif \
            --output opengrep-results.sarif \
            . || true
            
      - name: Save Security Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengrep-security-report
          path: opengrep-results.sarif
          if-no-files-found: ignore

  # 3. סריקת קונטיינר (Trivy)
  trivy:
    name: "🐳 Container Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t invoiceai-backend:test .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'invoiceai-backend:test'
          format: 'table'
          # אנחנו אומרים לו להכשיל את הריצה (exit-code 1) רק אם הוא מוצא חולשות קריטיות שיש להן תיקון
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
