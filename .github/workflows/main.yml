name: "Security Scans"

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

# נותנים לרובוט אישור מפורש לקרוא את הקוד ולכתוב תוצאות
permissions:
  contents: read
  security-events: write

jobs:
  opengrep:
    name: "🔍 SAST Scan (Opengrep)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/scripts/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Run Opengrep
        run: |
          opengrep scan \
            --config p/python \
            --config p/secrets \
            --sarif \
            --output opengrep-results.sarif \
            . || true
            
      # המעקף שלנו: שמירת הדוח כקובץ רגיל להורדה!
      - name: Save Security Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengrep-security-report
          path: opengrep-results.sarif
          if-no-files-found: ignore
