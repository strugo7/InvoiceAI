jobs:
  opengrep:
    name: "🔍 SAST Scan (Opengrep)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/scripts/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Opengrep
        run: |
          opengrep scan \
            --config p/python \
            --config p/secrets \
            --sarif \
            --output opengrep-results.sarif \
            . || true

      - name: Upload Opengrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: opengrep-results.sarif
          category: opengrep-sast
